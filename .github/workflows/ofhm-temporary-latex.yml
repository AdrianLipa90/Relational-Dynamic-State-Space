name: OFHM temporary LaTeX validation

on:
  push:
    branches:
      - feat/general-orbital-fractal-hilbert-moire-v0.1

jobs:
  latex:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-extra
      - name: Compile monograph pass 1
        run: pdflatex -interaction=nonstopmode -halt-on-error -output-directory=monograph monograph/main.tex
      - name: Compile monograph pass 2
        run: pdflatex -interaction=nonstopmode -halt-on-error -output-directory=monograph monograph/main.tex
