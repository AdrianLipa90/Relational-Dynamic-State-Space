name: OFHM temporary validation

on:
  push:
    branches:
      - feat/general-orbital-fractal-hilbert-moire-v0.1

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Targeted OFHM
        run: python -m pytest -q tests/test_orbital_fractal_hilbert_moire.py
      - name: Full RDSS suite
        run: python -m pytest -q
      - name: Static audit
        run: python scripts/static_audit.py
