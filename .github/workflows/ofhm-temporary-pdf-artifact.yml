name: OFHM temporary PDF artifact

on:
  push:
    branches:
      - feat/general-orbital-fractal-hilbert-moire-v0.1

jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-extra
      - name: Compile monograph
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory=monograph monograph/main.tex
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory=monograph monograph/main.tex
      - name: Upload monograph
        uses: actions/upload-artifact@v4
        with:
          name: RDSS-OFHM-monograph
          path: monograph/main.pdf
          if-no-files-found: error
